name: AM950 Daily Show Summarizer

on:
  schedule:
    # 7:00 PM Central Standard Time (01:00 UTC next day), Mon-Fri evening shows
    - cron: '0 1 * * 2-6'
    # 11:45 PM Central Standard Time (05:45 UTC next day), Mon-Fri Ghostbox Radio
    - cron: '45 5 * * 2-6'
  workflow_dispatch:
    inputs:
      show_group:
        description: 'Which show group to run (all, evening, or latenight)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - evening
          - latenight

permissions:
  contents: write

jobs:
  summarize-and-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run broadcast summary script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          SHOW_GROUP: ${{ github.event.schedule == '45 5 * * 2-6' && 'latenight' || (github.event.schedule == '0 1 * * 2-6' && 'evening' || github.event.inputs.show_group || 'all') }}
        run: |
          python -u summarizer.py

      - name: Commit tracked logs and history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_processed_video.txt episode_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update processed audio log and topic history [skip ci]" && git push origin main)
