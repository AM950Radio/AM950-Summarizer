name: AM950 Daily Show Summarizer

on:
  schedule:
    # 3:35 PM CT (Mon-Fri) -> The Gaily Show wrap-up
    - cron: '35 21 * * 1-5'
    # 5:35 PM CT (Mon-Fri) -> The Matt McNeil Show wrap-up
    - cron: '35 23 * * 1-5'
    # 6:35 PM CT (Mon-Fri) -> Native Roots Radio wrap-up
    - cron: '35 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize-and-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run broadcast summary script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        run: |
          python summarizer.py

      - name: Commit tracked video log
        run: |
          git config --global user.name "AM950 Bot"
          git config --global user.email "bot@am950radio.com"
          git add last_processed_video.txt
          git diff-index --quiet HEAD || git commit -m "Update processed video cache [skip ci]"
          git push
