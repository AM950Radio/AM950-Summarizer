name: AM950 Daily Show Summarizer

on:
  schedule:
    # 6:00 AM Central Time (12:00 UTC) Tuesday - Saturday
    - cron: '0 12 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run broadcast summary script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          SMTP_SERVER: 'smtp.gmail.com'
          SMTP_PORT: '465'
        run: |
          python -u summarizer.py

      - name: Commit tracked video log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_processed_video.txt
          git diff --staged --quiet || (git commit -m "Update processed video cache [skip ci]" && git push origin main)
