name: AM950 Daily Show Summarizer

on:
  schedule:
    # 6:00 AM Central Standard Time (12:00 UTC), Tuesday through Saturday
    - cron: '0 12 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize-and-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run broadcast summary script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python -u summarizer.py

      - name: Commit tracked logs and history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_processed_video.txt episode_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update processed audio log and topic history [skip ci]" && git push origin main)
